[package]
name = "agent-trace"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Machine-first CLI that closes the feedback loop for AI agents authoring SVGs from raster references: render, score (pixel + SSIM), localized diffs, and vision-friendly comparison images."
authors = ["agent-trace contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wyrd-company/agent-trace"
homepage = "https://github.com/wyrd-company/agent-trace"
readme = "README.md"
keywords = ["svg", "agent", "raster", "ssim", "diff"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["/.github", "/npm", "/scripts"]

[[bin]]
name = "agent-trace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = "0.5"
anyhow = "1"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
vtracer = "0.6"
visioncortex = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
