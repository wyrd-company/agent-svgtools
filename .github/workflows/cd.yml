name: cd

on:
  push:
    tags:
      # Bare SemVer, no "v" prefix; trailing * allows pre-release suffixes.
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Verify the pushed tag matches Cargo.toml and expose tag/version outputs.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version '$manifest'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  # 2. Build release binaries for every supported target and package them.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="agent-svgtools-${VERSION}-${TARGET}"
          mkdir -p artifacts
          tar -C "target/${TARGET}/release" -czf "artifacts/${name}.tar.gz" agent-svgtools
          (
            cd artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            else
              shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
          )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "agent-svgtools-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/agent-svgtools.exe" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "artifacts/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: artifacts/*

  # 3. Create the GitHub Release with every archive + checksum attached.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # 4. Publish to crates.io (only after the release exists).
  crates:
    needs: [version, build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # 5. Publish the npx-installable npm package (binaries already released).
  npm:
    needs: [version, build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: npm
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 6. Publish the Homebrew formula to the tap (binaries already released).
  homebrew:
    needs: [version, build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: wyrd-company/homebrew-tools
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}
      - name: Generate, commit, and push formula
        env:
          ARTIFACT_ROOT: artifacts
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TAP_DIR: homebrew-tools
        run: ./scripts/publish-homebrew-tap.sh
