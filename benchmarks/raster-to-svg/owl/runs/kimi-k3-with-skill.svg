<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Cartoon owl reconstructed from owl.png. Face axis ~x240; body axis x250. -->
  <defs>
    <!-- Left wing: dark base, orange inner patch, darker outer strip. -->
    <g id="wing">
      <path fill="#53352b" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round"
        d="M 95 190 C 78 205 68 235 68 268 C 68 305 76 345 95 378 C 108 399 124 412 140 418 C 148 400 153 375 154 350 C 155 310 150 265 140 230 C 135 212 128 200 120 195 Z"/>
      <path fill="#d56916"
        d="M 100 210 C 86 225 78 248 78 272 C 78 305 85 342 102 372 C 113 391 126 403 138 407 C 146 389 151 362 151 338 C 151 300 146 258 136 229 C 131 215 123 207 114 205 Z"/>
      <path fill="#934810"
        d="M 100 210 C 86 225 78 248 78 272 C 78 305 85 342 102 372 C 106 379 110 385 114 390 C 100 360 92 320 91 280 C 90 250 94 226 104 212 Z"/>
    </g>
    <!-- White zigzag feather tuft where wing meets shoulder. -->
    <g id="chest-tuft">
      <path fill="#f4f3ee" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round"
        d="M 138 201 C 128 205 116 212 107 221 C 111 228 115 232 119 236 C 111 240 104 246 100 253 C 106 257 111 260 115 264 C 110 268 107 273 108 279 C 116 283 124 284 130 282 C 138 272 145 252 147 232 C 148 219 145 208 138 201 Z"/>
    </g>
    <!-- One foot toe, origin at top center. -->
    <g id="toe">
      <path fill="#feb142" stroke="#1b1b1b" stroke-width="5"
        d="M -11 6 C -13 28 -9 46 0 52 C 9 46 13 28 11 6 C 11 -3 -11 -3 -11 6 Z"/>
      <path fill="#b07a2e"
        d="M -11 6 C -13 28 -9 46 -2 51 C -7 36 -8 18 -6 2 C -9 0 -11 2 -11 6 Z"/>
    </g>
    <!-- One eye, origin at pupil center; iris sits 10px above. -->
    <g id="eye">
      <ellipse cx="0" cy="-10" rx="28" ry="39" fill="#d56916"/>
      <circle r="26" fill="#53352b"/>
      <circle r="22" fill="#fdfdfd"/>
      <circle r="17" fill="#111111"/>
      <circle cx="-6" cy="-6" r="5" fill="#ffffff"/>
    </g>
  </defs>

  <g id="owl">
    <!-- Body egg, head at top. -->
    <path id="body" fill="#7a4e40" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"
      d="M 250 4 C 335 6 390 68 393 152 C 396 240 388 350 338 415 C 305 455 195 455 162 415 C 112 350 104 240 107 152 C 110 68 165 6 250 4 Z"/>

    <!-- Crown and side feather spikes. -->
    <g id="head-tufts" fill="#2b1d19">
      <path d="M 170 18 L 182 2 L 198 18 Z"/>
      <path d="M 238 12 L 247 0 L 256 13 Z"/>
      <path d="M 294 18 L 314 8 L 322 22 Z"/>
      <path d="M 130 55 L 115 76 L 140 72 Z"/>
      <path d="M 352 56 L 370 78 L 340 70 Z"/>
    </g>

    <use href="#wing" id="wing-left"/>
    <use href="#wing" id="wing-right" transform="translate(499 0) scale(-1 1)"/>
    <use href="#chest-tuft" id="tuft-left"/>
    <use href="#chest-tuft" id="tuft-right" transform="translate(500 0) scale(-1 1)"/>

    <!-- Belly: white feather patch with zigzag edges and gray shadow pool. -->
    <g id="belly">
      <path id="belly-white" fill="#fefefe" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round"
        d="M 250 273 C 226 276 202 284 191 298 L 205 312 L 187 326 L 198 341 L 182 355 L 193 370 L 186 385 L 197 399 L 189 412 C 198 420 205 425 212 431 C 224 440 237 444 250 445 C 263 444 276 440 288 431 C 295 425 302 420 311 412 L 303 399 L 314 385 L 307 370 L 318 355 L 302 341 L 313 326 L 295 312 L 309 298 C 298 284 274 276 250 273 Z"/>
      <path id="belly-shadow" fill="#b0b0b0"
        d="M 190 398 C 210 388 230 385 250 385 C 270 385 290 388 310 398 C 305 420 282 443 250 446 C 218 443 195 420 190 398 Z"/>
    </g>

    <!-- Face: two cream discs, shading, eyes, beak. -->
    <g id="face">
      <ellipse id="under-disc-shade" cx="250" cy="205" rx="100" ry="30" fill="#9b9474"/>
      <ellipse id="face-disc-left" cx="175" cy="136" rx="66" ry="85" fill="#f0ebdf"/>
      <ellipse id="face-disc-right" cx="311" cy="136" rx="66" ry="85" fill="#e6e3d9"/>
      <path id="disc-shade-right" fill="#b0b0b0" opacity="0.7"
        d="M 343 62 C 368 84 379 110 379 136 C 379 162 368 188 343 210 C 360 186 368 162 368 136 C 368 110 360 86 343 62 Z"/>
      <use href="#eye" id="eye-left" x="187" y="133"/>
      <use href="#eye" id="eye-right" x="290" y="133"/>
      <path id="beak" fill="#e2ac24" stroke="#53352b" stroke-width="3" stroke-linejoin="round"
        d="M 237 146 C 226 148 219 158 219 170 C 219 185 226 200 237 208 C 248 200 255 185 255 170 C 255 158 248 148 237 146 Z"/>
    </g>

    <!-- Feet: three toes each, in front of the body bottom. -->
    <g id="feet">
      <use href="#toe" id="toe-l1" x="209" y="434"/>
      <use href="#toe" id="toe-l2" x="229" y="434"/>
      <use href="#toe" id="toe-l3" x="249" y="434"/>
      <use href="#toe" id="toe-r1" x="274" y="434"/>
      <use href="#toe" id="toe-r2" x="294" y="434"/>
      <use href="#toe" id="toe-r3" x="313" y="434"/>
    </g>
  </g>
</svg>
