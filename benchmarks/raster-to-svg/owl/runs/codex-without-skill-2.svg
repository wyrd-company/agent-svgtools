      <ellipse cx="294" cy="135" rx="21" ry="21"/>
    </g>
    <g fill="#1b1b1b" stroke="#737373" stroke-width="2">
      <ellipse cx="190" cy="135" rx="15" ry="16"/>
      <ellipse cx="294" cy="136" rx="15" ry="16"/>
    </g>
    <g fill="#000">
      <ellipse cx="190" cy="135" rx="11" ry="12"/>
      <ellipse cx="294" cy="136" rx="11" ry="12"/>
    </g>
    <g fill="#fff">
      <circle cx="193" cy="132" r="3.5"/>
      <circle cx="297" cy="133" r="3.5"/>
    </g>
  </g>

  <!-- Beak. -->
  <path fill="#d49c22" stroke="#8d6722" stroke-width="3" stroke-linejoin="round"
        d="M241 152 C253 152 261 161 260 174 C259 188 251 200 240 210
