             C370 255 371 264 369 275 C363 261 358 253 350 249 Z"/>
  </g>

  <!-- Chest plumage. -->
  <use href="#bellyShape" fill="#b0b0b0"/>
  <path clip-path="url(#bellyClip)" fill="#fefefe"
        d="M169 264 H331 V386 C310 394 291 402 265 404 C233 408 201 403 181 392 L169 386 Z"/>
  <use href="#bellyShape" fill="none" stroke="#000" stroke-width="5"
