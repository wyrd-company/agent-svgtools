<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <title>Brown and orange owl</title>
  <defs>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f0e6"/>
      <stop offset=".72" stop-color="#dcdbd3"/>
      <stop offset="1" stop-color="#aaa991"/>
    </linearGradient>
    <linearGradient id="rightFace" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#e8e8e2"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d96d16"/>
      <stop offset=".72" stop-color="#d56916"/>
      <stop offset="1" stop-color="#934810"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d96d16"/>
      <stop offset=".72" stop-color="#d56916"/>
      <stop offset="1" stop-color="#934810"/>
    </linearGradient>
    <path id="bellyShape" d="M250 270 C273 269 294 280 305 298 C299 303 302 309 311 318
        C316 322 318 326 320 329 C311 335 316 346 322 357 L327 363 L315 365
        C316 376 321 389 319 397 C311 397 308 411 307 423 C301 425 294 435 291 442
