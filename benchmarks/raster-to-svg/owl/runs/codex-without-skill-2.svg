        C184 392 187 375 185 364 L175 365 C176 355 183 340 185 331 L181 328
        C190 316 202 307 199 299 C212 281 228 272 250 270 Z"/>
    <clipPath id="bellyClip">
      <use href="#bellyShape"/>
    </clipPath>
  </defs>

  <!-- Feet sit behind the body. -->
  <g fill="#feb142" stroke="#000" stroke-width="4" stroke-linejoin="round">
