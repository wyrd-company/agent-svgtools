    <path d="M217 446 C225 451 228 474 221 493 C217 506 208 501 204 485 C200 471 205 452 209 445 Z"/>
    <path d="M229 445 C240 450 243 470 237 490 C233 507 223 502 222 488 C219 473 223 454 225 446 Z"/>
    <path d="M273 445 C267 455 263 475 268 490 C272 506 281 501 282 486 C284 469 280 452 278 446 Z"/>
    <path d="M285 445 C278 456 279 477 285 493 C290 507 299 501 298 485 C299 466 294 451 291 445 Z"/>
    <path d="M298 444 C306 448 315 462 315 481 C315 503 304 507 300 490 C297 476 299 455 294 446 Z"/>
  </g>

  <!-- Rear body and ear tufts. -->
  <path fill="#7a4e40" d="M97 223 C101 198 116 173 126 158 L158 196 L142 238 Z"/>
  <path fill="#7a4e40" d="M403 223 C399 198 384 173 374 158 L342 198 L358 238 Z"/>
  <path fill="#7a4e40" stroke="#000" stroke-width="5" stroke-linejoin="round"
