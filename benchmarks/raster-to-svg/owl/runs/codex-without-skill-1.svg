<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Wide-eyed brown owl</title>
  <desc id="desc">A hand-drawn brown owl with orange wings, large pale eyes, a gold beak and feet, and a white-and-gray belly.</desc>
  <defs>
    <linearGradient id="left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1e7"/>
      <stop offset=".66" stop-color="#e9e7df"/>
      <stop offset="1" stop-color="#aaa27a"/>
    </linearGradient>
    <linearGradient id="right-face" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#deddd5"/>
      <stop offset="1" stop-color="#adaca6"/>
    </linearGradient>
    <linearGradient id="left-iris" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ff7600"/>
      <stop offset="1" stop-color="#eb5d00"/>
    </linearGradient>
    <linearGradient id="right-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dd7419"/>
      <stop offset="1" stop-color="#aa6817"/>
    </linearGradient>
    <linearGradient id="beak-gold" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f2b91c"/>
      <stop offset="1" stop-color="#d99b1e"/>
    </linearGradient>
    <linearGradient id="foot-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e39d20"/>
      <stop offset=".38" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#eb9915"/>
    </linearGradient>
    <path id="belly-shape" d="M200 298 C218 275 236 270 252 270 C271 270 289 279 304 297 C307 300 306 303 302 307 C306 316 313 323 320 327 C323 329 322 332 317 335 C320 344 325 353 328 362 C330 365 327 366 320 365 C317 377 319 388 321 398 C322 402 319 403 315 400 C312 412 311 421 305 428 C301 431 296 429 291 433 C285 442 279 448 269 450 C262 448 256 452 251 455 C244 452 240 447 232 448 C222 446 218 438 210 432 C203 431 199 430 196 427 C192 420 189 408 186 398 C182 399 178 402 178 397 C178 385 182 375 179 365 C174 366 172 364 174 359 C177 349 181 341 184 334 C180 332 179 329 183 326 C190 317 201 308 199 301 C198 300 198 299 200 298 Z"/>
    <clipPath id="belly-clip">
      <use href="#belly-shape"/>
    </clipPath>
  </defs>

  <g stroke="#050403" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Feet sit behind the body. -->
    <path fill="url(#foot-gold)" d="M203 444 C192 443 187 453 187 469 C187 484 192 495 199 495 C207 495 210 481 211 466 C211 454 209 447 203 444 Z"/>
    <path fill="url(#foot-gold)" d="M216 445 C205 447 202 459 204 474 C206 487 212 495 220 494 C228 493 232 479 232 464 C231 452 226 445 216 445 Z"/>
    <path fill="url(#foot-gold)" d="M232 444 C225 447 225 458 226 471 C227 485 230 493 235 493 C243 493 247 478 246 463 C245 451 241 444 232 444 Z"/>
    <path fill="url(#foot-gold)" d="M270 444 C262 447 260 456 261 469 C262 484 266 493 273 493 C281 493 284 480 283 464 C282 452 278 445 270 444 Z"/>
    <path fill="url(#foot-gold)" d="M286 444 C277 447 276 457 277 471 C278 485 283 495 290 495 C298 494 302 481 301 465 C300 452 295 445 286 444 Z"/>
    <path fill="url(#foot-gold)" d="M301 444 C295 448 295 458 296 471 C297 485 301 493 306 493 C314 492 317 479 315 463 C313 451 309 444 301 444 Z"/>

    <!-- Orange wings. -->
    <path fill="#d66a17" d="M120 220 C92 219 76 239 75 274 C74 327 96 380 148 410 C156 415 164 417 166 412 C168 409 161 399 157 389 C145 359 140 324 140 289 C140 254 139 225 120 220 Z"/>
    <path fill="#934810" stroke="none" d="M80 313 C88 357 110 391 153 412 C158 414 163 415 165 412 C159 403 154 392 150 381 C115 362 92 340 80 313 Z"/>
    <path fill="#d66a17" d="M380 220 C408 219 424 239 425 274 C426 327 404 380 352 410 C344 415 336 417 334 412 C332 409 339 399 343 389 C355 359 360 324 360 289 C360 254 361 225 380 220 Z"/>
    <path fill="#934810" stroke="none" d="M420 313 C412 357 390 391 347 412 C342 414 337 415 335 412 C341 403 346 392 350 381 C385 362 408 340 420 313 Z"/>

    <!-- Continuous head and torso silhouette. -->
    <path fill="#7a4e40" d="M101 222 C107 202 114 180 113 157 C107 131 109 102 120 77 C139 34 182 6 229 6 C237 6 242 7 247 8 L250 1 L255 10 C301 8 338 27 362 59 C380 83 386 114 383 148 C382 173 392 199 399 222 C383 217 370 219 360 229 C362 263 362 304 360 341 C358 375 352 401 341 416 C316 440 285 453 251 456 C215 454 184 441 159 417 C146 400 140 374 139 341 C137 304 139 260 140 229 C130 218 117 217 101 222 Z"/>

    <!-- Pale facial disks. -->
    <path fill="url(#left-face)" stroke="none" d="M181 52 C139 51 113 84 108 131 C102 180 119 213 157 225 C188 235 217 228 240 208 C242 188 242 166 240 143 C237 89 215 53 181 52 Z"/>
    <path fill="url(#right-face)" stroke="none" d="M306 53 C269 52 247 87 242 143 C240 166 241 188 240 208 C259 229 286 237 315 231 C354 223 376 192 376 150 C376 96 347 54 306 53 Z"/>

    <!-- Irises and pupils. -->
    <path fill="url(#left-iris)" stroke="#d59a16" stroke-width="2" d="M186 84 C168 84 159 99 159 124 C158 150 166 162 186 163 C207 163 216 150 216 125 C215 99 207 84 186 84 Z"/>
    <ellipse cx="190" cy="134" rx="24" ry="21" fill="#f5f4f1" stroke-width="3" transform="rotate(-4 190 134)"/>
    <ellipse cx="190" cy="134" rx="17" ry="16" fill="#4c3027" stroke-width="3" transform="rotate(-4 190 134)"/>
    <ellipse cx="191" cy="135" rx="11" ry="12" fill="#030303" stroke="none"/>
    <circle cx="192" cy="134" r="4.5" fill="#fff" stroke="none"/>

    <path fill="url(#right-iris)" stroke="#a66b1a" stroke-width="2" d="M295 86 C276 85 265 100 264 125 C264 150 274 163 294 164 C314 164 323 149 323 125 C322 100 314 87 295 86 Z"/>
    <ellipse cx="294" cy="135" rx="22" ry="20" fill="#eeeeda" stroke-width="3" transform="rotate(4 294 135)"/>
    <ellipse cx="294" cy="135" rx="16" ry="16" fill="#4a3028" stroke-width="3" transform="rotate(4 294 135)"/>
    <ellipse cx="295" cy="136" rx="10" ry="12" fill="#020202" stroke="none"/>
    <circle cx="295" cy="135" r="4" fill="#fff" stroke="none"/>

    <!-- Two-part beak. -->
    <path fill="url(#beak-gold)" stroke="#765040" stroke-width="3" d="M241 153 C228 153 221 160 221 173 C221 188 228 200 240 209 C252 201 259 187 260 172 C260 159 254 153 241 153 Z"/>
    <path fill="#7a4e40" stroke="none" d="M240 209 C247 204 253 198 257 190 C254 204 248 215 240 223 C233 217 227 207 224 197 C228 202 233 207 240 209 Z"/>

    <!-- Shoulder feather tufts. -->
    <path fill="#deddd5" d="M113 229 C123 219 133 218 140 224 L126 237 C134 232 142 231 145 235 L113 264 L137 247 L132 271 L149 246 L156 254 L153 232 C149 225 145 220 139 216 C129 216 120 220 113 229 Z"/>
    <path fill="#deddd5" d="M387 229 C377 219 367 218 360 224 L374 237 C366 232 358 231 355 235 L387 264 L363 247 L368 271 L351 246 L344 254 L347 232 C351 225 355 220 361 216 C371 216 380 220 387 229 Z"/>

    <!-- Belly: gray base, white upper plumage, one shared outline. -->
    <use href="#belly-shape" fill="#b0b0b0" stroke="none"/>
    <path clip-path="url(#belly-clip)" fill="#fff" stroke="none" d="M172 260 H331 V363 C320 382 303 393 282 400 C246 411 210 406 178 393 Z"/>
    <use href="#belly-shape" fill="none"/>
  </g>
</svg>
