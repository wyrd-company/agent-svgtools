<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Wide-eyed brown owl</title>
  <desc id="desc">A clean vector reconstruction of a round brown owl with orange wings, pale face disks, a white belly, and golden feet.</desc>

  <!-- Palette: #000000 #7A4E40 #53352B #D56916 #934810 #F2F0E6 #DCDBD3 #B0B0B0 #B07A2E #D49C22 #FEB142 #FFFFFF -->
